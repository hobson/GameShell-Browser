[project]
name = "gameshell-admin"
version = "0.1.0"
description = "Password-protected settings page for GameShell-Browser deployments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "flask-admin",
    "flask-admin-toolkit",
    "python-dotenv",
]

[tool.uv.sources]
# Not published anywhere -- ../flask-admin-toolkit (i.e. deploy/flask-admin-toolkit)
# is populated by scripts/sync_flask_admin_toolkit.sh before this is installed.
# See README.md.
flask-admin-toolkit = { path = "../flask-admin-toolkit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
