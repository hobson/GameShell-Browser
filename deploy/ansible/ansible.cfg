[defaults]
inventory = inventory/hosts.ini
roles_path = playbooks/roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# The old community.general.yaml callback was removed in that collection's
# v12; result_format is the built-in replacement.
result_format = yaml
# The shared totalgood.cloud collection lives outside this repo. Installing it
# via `ansible-galaxy collection install -r requirements.yml` puts it in the
# default path; this extra entry also lets you work straight from a checkout.
collections_path = ~/.ansible/collections:~/code/od/ansible-cloud

[ssh_connection]
pipelining = True
