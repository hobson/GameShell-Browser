# Static inventory for GameShell boxes that already exist.
#
# A VM created by playbooks/provision.yml does NOT need an entry here: the
# cloud_vm role adds it to an in-memory hcloud_new / contabo_new group for the
# rest of that run. Add a host here once it is provisioned, so you can re-run
# playbooks/configure.yml against it on its own later.
#
# ansible_host may be an IP or a Host alias from your ~/.ssh/config.

[gameshell]
# gsh-prod ansible_host=203.0.113.10

[gameshell:vars]
# ansible_user and ansible_port come from group_vars/all.yml (app_user/ssh_port).

# Hetzner box for testing
[test-gsh]
gsh ansible_host=204.168.165.176 ansible_user=root ansible_port=22
