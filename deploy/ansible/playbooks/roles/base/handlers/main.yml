---
- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

# Socket-activated sshd: the socket owns the listening port, so it is the unit
# that has to be restarted (and daemon-reload'd) for a port change to take.
# Existing connections survive; only new ones use the new port.
- name: Restart ssh socket
  ansible.builtin.systemd:
    name: ssh.socket
    state: restarted
    daemon_reload: true
