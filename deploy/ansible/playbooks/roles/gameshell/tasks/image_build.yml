---
# Build the image on the VM. No registry, no credentials -- self-contained, at
# the cost of a few minutes' build per change.
#
# The Dockerfile pulls the released gameshell.sh archive from GitHub at build
# time, so the build needs working DNS/network on the VM (the *containers* are
# --network none, the build is not).

- name: Check whether the image already exists
  ansible.builtin.command: "docker image inspect {{ gsh_image }}"
  become: true
  become_user: "{{ app_user }}"
  register: _gameshell_gsh_image_present
  changed_when: false
  failed_when: false

- name: Build the GameShell image
  ansible.builtin.command:
    cmd: "docker build -t {{ gsh_image }} ."
    chdir: "{{ gsh_repo_dir }}"
  become: true
  become_user: "{{ app_user }}"
  # Rebuild only when there is a reason to: no image yet, the checkout moved, or
  # the operator forced it. This is what lets a second site.yml run report
  # changed=0 instead of burning minutes rebuilding an identical image.
  when: >-
    _gameshell_gsh_image_present.rc != 0
    or _gameshell_gsh_repo.changed
    or (gsh_force_image_build | bool)
  register: _gameshell_gsh_build
  # The Dockerfile's ENV line emits a LegacyKeyValueFormat warning on modern
  # buildx. It is harmless and expected; do not let it fail the build.
  changed_when: _gameshell_gsh_build.rc == 0
  notify: Restart gameshell-ttyd
